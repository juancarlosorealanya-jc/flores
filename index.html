<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Para ti ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Estrellas y luciérnagas -->
  <canvas id="fondo"></canvas>

  <!-- ============ PANTALLA 1: ENTRADA (reproductor) ============ -->
  <section id="entrada" class="pantalla activa">
    <div class="reproductor">
      <div class="caratula">🌼</div>
      <h1>Tengo algo para ti</h1>
      <p class="pista">Espero <strong>TE GUSTE</strong> te amooo</p>

      <div class="progreso"><div class="barra" id="barra"></div></div>
      <div class="tiempos"><span id="tiempo">0:00</span><span>0:03</span></div>

      <button id="btnPlay" class="btn-play" aria-label="Reproducir y entrar">
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ico-pausa" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <p class="clic">▶ By JC</p>
    </div>
  </section>

  <!-- ============ PANTALLA 2: FLORES ============ -->
  <section id="flores" class="pantalla">

    <div class="mensaje">
      <h2 class="linea1"><span id="txt1"></span><span class="emojis" id="emojis"><span class="corazon">❤️</span><span class="cara">😍</span></span></h2>
      <p class="linea2" id="txt2"></p>
    </div>

    <svg id="jardin" viewBox="0 0 411 535" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" aria-label="Flores amarillas">
      <defs>
        <radialGradient id="gLuz" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ffd31a" stop-opacity=".30"/>
          <stop offset="1" stop-color="#ffd31a" stop-opacity="0"/>
        </radialGradient>

        <!-- Tonos y sombras de los pétalos de rosa -->
        <radialGradient id="gRosaBase" cx="42%" cy="30%" r="78%">
          <stop offset="0" stop-color="#fff8a8"/>
          <stop offset=".42" stop-color="#ffe04b"/>
          <stop offset=".76" stop-color="#e9a900"/>
          <stop offset="1" stop-color="#a85a00"/>
        </radialGradient>
        <linearGradient id="gRosaClaro" x1="0" y1="0" x2=".72" y2="1">
          <stop offset="0" stop-color="#fffbd0"/>
          <stop offset=".35" stop-color="#ffe96c"/>
          <stop offset="1" stop-color="#d89100"/>
        </linearGradient>
        <linearGradient id="gRosaMedio" x1=".15" y1="0" x2=".82" y2="1">
          <stop offset="0" stop-color="#fff39a"/>
          <stop offset=".5" stop-color="#f8c51c"/>
          <stop offset="1" stop-color="#b86a00"/>
        </linearGradient>
        <radialGradient id="gRosaCentro" cx="38%" cy="34%" r="72%">
          <stop offset="0" stop-color="#fff6a1"/>
          <stop offset=".5" stop-color="#f5bb08"/>
          <stop offset="1" stop-color="#8e4900"/>
        </radialGradient>
        <linearGradient id="gSepalo" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#70c94b"/>
          <stop offset=".5" stop-color="#23782c"/>
          <stop offset="1" stop-color="#0b481f"/>
        </linearGradient>
        <filter id="sombraRosa" x="-55%" y="-55%" width="210%" height="220%">
          <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#4b2600" flood-opacity=".45"/>
          <feDropShadow dx="-1" dy="-1" stdDeviation="1.2" flood-color="#fff4a0" flood-opacity=".22"/>
        </filter>

        <linearGradient id="gTallo" gradientUnits="userSpaceOnUse" x1="0" y1="455" x2="0" y2="200">
          <stop offset="0" stop-color="#0a6f80"/>
          <stop offset="1" stop-color="#1fd0cf"/>
        </linearGradient>

        <linearGradient id="gVerde" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0b8f2a"/>
          <stop offset="1" stop-color="#43e653"/>
        </linearGradient>

        <linearGradient id="gAzul0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b6f80"/><stop offset="1" stop-color="#33d9de"/></linearGradient>
        <linearGradient id="gAzul1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06455a"/><stop offset="1" stop-color="#19b6c6"/></linearGradient>
        <linearGradient id="gAzul2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#032f40"/><stop offset="1" stop-color="#0f93aa"/></linearGradient>

        <linearGradient id="gPasto" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#075c18"/>
          <stop offset="1" stop-color="#2be045"/>
        </linearGradient>
        <linearGradient id="gPasto2" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#04400f"/>
          <stop offset="1" stop-color="#159a2c"/>
        </linearGradient>

        <!-- Rosa amarilla natural (centrada en 0,0) -->
        <g id="flor" filter="url(#sombraRosa)">
          <!-- sépalos, visibles detrás de la flor -->
          <path d="M0 8 C-4 14 -6 20 -5 25 C-1 22 1 17 2 11Z" fill="url(#gSepalo)"/>
          <path d="M-3 10 C-13 12 -19 18 -21 23 C-13 22 -6 18 1 12Z" fill="url(#gSepalo)"/>
          <path d="M3 10 C13 12 19 18 21 23 C13 22 6 18 -1 12Z" fill="url(#gSepalo)"/>

          <!-- pétalos exteriores irregulares -->
          <path d="M0 13 C-15 18 -30 12 -31 -2 C-32 -14 -22 -22 -11 -19 C-6 -30 7 -34 15 -24 C27 -26 34 -16 30 -5 C34 7 20 17 8 14Z" fill="url(#gRosaBase)"/>
          <path d="M-1 11 C-14 15 -27 8 -26 -4 C-25 -14 -16 -19 -7 -14 C-10 -5 -8 4 -1 11Z" fill="url(#gRosaMedio)" opacity=".96"/>
          <path d="M2 12 C16 15 29 7 27 -5 C25 -15 16 -19 7 -14 C11 -5 9 5 2 12Z" fill="url(#gRosaClaro)" opacity=".94"/>

          <!-- segunda corona: pétalos curvados y superpuestos -->
          <path d="M-22 0 C-24 -12 -14 -25 -3 -20 C2 -17 1 -8 -2 0 C-7 10 -17 11 -22 0Z" fill="url(#gRosaClaro)"/>
          <path d="M22 1 C25 -11 16 -24 5 -20 C0 -17 0 -8 3 0 C7 10 17 12 22 1Z" fill="url(#gRosaMedio)"/>
          <path d="M-15 9 C-18 -2 -11 -16 -1 -16 C7 -15 8 -6 4 2 C0 11 -9 15 -15 9Z" fill="url(#gRosaMedio)"/>
          <path d="M15 9 C18 -2 11 -16 1 -16 C-7 -15 -8 -6 -4 2 C0 11 9 15 15 9Z" fill="url(#gRosaClaro)"/>

          <!-- corazón en espiral de la rosa -->
          <path d="M-8 2 C-13 -6 -7 -16 1 -16 C9 -16 13 -8 9 -1 C6 5 -2 8 -8 2Z" fill="url(#gRosaCentro)"/>
          <path d="M-5 -3 C-3 -10 5 -12 8 -6 C11 0 4 6 -2 4 C-7 3 -9 -1 -5 -3Z" fill="#e6a000"/>
          <path d="M-2 1 C-5 -3 -1 -8 3 -7 C8 -6 8 -1 5 2 C2 5 -1 4 -2 1Z" fill="#ffd83c"/>
          <path d="M0 -1 C1 -4 5 -4 6 -1 C6 2 3 3 1 2" fill="none" stroke="#995000" stroke-width="1.15" stroke-linecap="round" opacity=".8"/>

          <!-- luces finas para dar textura natural -->
          <path d="M-25 -5 C-18 -9 -12 -8 -8 -4" fill="none" stroke="#fff7a9" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
          <path d="M9 -13 C15 -16 21 -12 23 -7" fill="none" stroke="#fffbd0" stroke-width="1.1" stroke-linecap="round" opacity=".5"/>
          <path d="M-10 10 C-4 12 3 11 8 8" fill="none" stroke="#9d5700" stroke-width="1" stroke-linecap="round" opacity=".38"/>
          <ellipse cx="-13" cy="-13" rx="2.2" ry="1.1" fill="#fff" opacity=".38" transform="rotate(-24 -13 -13)"/>
        </g>
      </defs>

      <!-- resplandor -->
      <circle cx="205" cy="255" r="170" fill="url(#gLuz)" class="luz"/>

      <g id="pastoAtras"></g>

      <!-- Flores (se generan en script.js) -->
      <g id="plantas"></g>

      <g id="arbusto"></g>
      <g id="pastoFrente"></g>
    </svg>

    <button id="btnSonido" class="btn-sonido" aria-label="Silenciar o activar música">🔊</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
